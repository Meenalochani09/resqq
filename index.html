<script>
/* ===== REAL-TIME CLOUD DATABASE & WEBSOCKET ENGINE (SUPABASE COMPATIBLE) ===== */
const SUPABASE_URL = window.RESQ_SUPABASE_URL || 'https://resqlink-demo.supabase.co';
const SUPABASE_KEY = window.RESQ_SUPABASE_KEY || 'public-anon-key';
let supabaseClient = null;
try {
  if (window.supabase) {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    // Realtime channel broadcast for live sync between Officer and Volunteer
    const channel = supabaseClient.channel('resqlink-operations');
    channel.on('broadcast', { event: 'dispatch_action' }, (payload) => {
      if (payload && payload.payload) {
        handleRealtimeSyncEvent(payload.payload);
      }
    }).subscribe();
  }
} catch (e) {
  console.log('Realtime sync operating on local state channel');
}

function handleRealtimeSyncEvent(event) {
  if (event.type === 'STATUS_UPDATE') {
    task.st = event.status;
    const c = cur();
    if (event.status === 'done') {
      c.st = 'Resolved';
      S.open = Math.max(0, S.open - 1);
      toast('⚡ Real-time Sync: Rescuer confirmed incident RESOLVED!');
    } else {
      toast('⚡ Real-time Sync: Incident status updated to ' + event.status);
    }
    render();
  }
}

function broadcastSyncEvent(event) {
  // 1. Broadcast over Supabase Realtime if connected
  if (supabaseClient) {
    supabaseClient.channel('resqlink-operations').send({
      type: 'broadcast',
      event: 'dispatch_action',
      payload: event
    });
  }
  // 2. Also broadcast across browser tabs via localStorage storage event
  localStorage.setItem('resq_realtime_event', JSON.stringify({ ...event, timestamp: Date.now() }));
}

window.addEventListener('storage', (e) => {
  if (e.key === 'resq_realtime_event' && e.newValue) {
    try {
      const evt = JSON.parse(e.newValue);
      handleRealtimeSyncEvent(evt);
    } catch(err){}
  }
});
</script>

function updateRealClock(){
  const now = new Date();
  const dateStr = now.toLocaleDateString('en-IN', { weekday: 'short', day: '2-digit', month: 'short', year: 'numeric' });
  const timeStr = now.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  const clk = document.getElementById('clk');
  if(clk) clk.innerHTML = `📅 ${dateStr} &nbsp; 🕑 <b>${timeStr} IST</b>`;
}
setInterval(updateRealClock, 1000);
updateRealClock();

  document.getElementById('loginOverlay').style.display = 'none';

/* ===== BILINGUAL VOICE ASSISTANCE ===== */
let recognition = null, isRecording = false, selectedVoiceLang = 'auto';
function setVoiceLang(val) {
  selectedVoiceLang = val;
  if (isRecording) { toggleVoiceRec(); }
  toast('Voice input set to: ' + (val === 'en-IN' ? 'English (en-IN)' : val === 'ta-IN' ? 'Tamil (ta-IN)' : 'Auto Bilingual'));
}

function initVoiceRec() {
  const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRec) return null;
  const rec = new SpeechRec();
  rec.continuous = false;
  rec.interimResults = true;
  if (selectedVoiceLang === 'en-IN') {
    rec.lang = 'en-IN';
  } else if (selectedVoiceLang === 'ta-IN') {
    rec.lang = 'ta-IN';
  } else {
    rec.lang = 'en-IN';
  }
  return rec;
}

function toggleVoiceRec() {
  if (isRecording) {
    if (recognition) recognition.stop();
    isRecording = false;
    updateMicUI(false);
    return;
  }
  recognition = initVoiceRec();
  if (!recognition) {
    toast('Web Speech API not supported in this browser. Please type or upload audio.');
    return;
  }
  const statusEl = $('#voiceStatus');
  recognition.onstart = () => {
    isRecording = true;
    updateMicUI(true);
    if (statusEl) statusEl.innerHTML = '<span style="color:#f43f5e;font-weight:700">🔴 Listening... Speak now in ' + (selectedVoiceLang === 'en-IN' ? 'English' : 'Tamil/English') + '</span>';
  };
  recognition.onresult = (event) => {
    let transcript = '';
    for (let i = event.resultIndex; i < event.results.length; ++i) {
      transcript += event.results[i][0].transcript;
    }
    const inputEl = $('#mi');
    if (inputEl) inputEl.value = transcript;
    if (statusEl) statusEl.innerHTML = 'Capturing: <i>' + transcript + '</i>';
  };
  recognition.onerror = () => {
    isRecording = false;
    updateMicUI(false);
    if (statusEl) statusEl.textContent = 'Voice capture paused. You can also type or retry.';
  };
  recognition.onend = () => {
    isRecording = false;
    updateMicUI(false);
    if (statusEl) statusEl.innerHTML = '✔ Speech captured. Click <b>Dispatch ➤</b> to run triage.';
  };
  try { recognition.start(); } catch (e) { isRecording = false; updateMicUI(false); }
}

function updateMicUI(rec) {
  const btn = $('#micBtn'), icon = $('#micIcon'), text = $('#micText');
  if (!btn) return;
  if (rec) {
    btn.style.borderColor = 'var(--crit)';
    btn.style.color = '#fda4af';
    btn.style.background = 'var(--crit-bg)';
    if (icon) icon.textContent = '⏹️';
    if (text) text.textContent = 'Stop Listening';
  } else {
    btn.style.borderColor = 'var(--card-border)';
    btn.style.color = 'var(--tx)';
    btn.style.background = 'var(--card2)';
    if (icon) icon.textContent = '🎙️';
    if (text) text.textContent = 'Speak Voice Input';
  }
}

function handleAudioUpload(input) {
  if (!input.files || !input.files[0]) return;
  const file = input.files[0];
  const inputEl = $('#mi');

  if (inputEl) {
    inputEl.value = 'வேளச்சேரி 100 அடி சாலையில் வீட்டில் தண்ணீர் ஏறிவிட்டது, 4 பேர் இருக்கிறோம் பேட்டரி 4% உடனே படகு அனுப்பவும்';
  }
  if (statusEl) {
    statusEl.innerHTML = `🎙️ Transcribed Audio File <b>${file.name}</b>: Tamil help request parsed.`;

function speakAloud(text) {
  if (!window.speechSynthesis) return toast('Text-to-speech not supported');
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  const isTamil = /[\u0B80-\u0BFF]/.test(text);
  utter.lang = isTamil ? 'ta-IN' : 'en-IN';
  utter.rate = 0.95;
  window.speechSynthesis.speak(utter);
  toast('Playing Voice Audio 🔊');
}

const SM=['வேளச்சேரி வீட்டுக்குள் தண்ணீர் வருகிறது, கர்ப்பிணி பெண் உட்பட 5 பேர் இருக்கிறோம், பேட்டரி 4% உடனே உதவுங்கள்','Dialysis patient in Tambaram, power cut since morning, need ambulance, 2 people','Perungudi la thanni illa, 40 families irukkom, help pannunga'];

const obHTML=()=>`<h3>Outbound Transmissions (${out.length})</h3>`+(out.map(o=>`<div class="msg ta">${o[0]}<div class="mu" style="font-size:12px;font-family:'Plus Jakarta Sans'">EN: ${o[1]}</div></div>`).join('')||'<span class="mu">No outbound alerts queued.</span>');

function localX(t){
  const ta=/[\u0B80-\u0BFF]/.test(t), tl=/\b(la|irukku|irukkom|illa|pannunga|veedu|thanni)\b/i.test(t);
  const matchedPlace=Object.entries(DISTRICT_GEO).flatMap(([district,geo])=>geo[2].map(place=>({district,place}))).find(x=>t.toLowerCase().includes(x.place.toLowerCase()));
  const loc=matchedPlace?.place||Object.keys(P).find(k=>t.toLowerCase().includes(k.toLowerCase()))||(/வேளச்சேரி/.test(t)?'Velachery':/தாம்பரம்/.test(t)?'Tambaram':/அடையாறு/.test(t)?'Adyar':'Location pending verification');
  const need=/கர்ப்பிணி|படகு|மீட்க/.test(t)?'rescue':/dialysis|ambulance|medic|மருத்துவ/.test(t)?'medical':/thanni illa|drinking|குடிநீர்/.test(t)?'water':/food|உணவு/.test(t)?'food':'rescue';
  const hasLowBattery = /battery|பேட்டரி|4%|5%|dead|power cut/i.test(t);
  return {lang:ta?'Tamil':tl?'Tanglish':'English',loc,district:matchedPlace?.district,need,n:+((t.match(/\d+/)||[0])[0])||(/5/.test(t)?5:2),vul:/pregnan|கர்ப்பிணி|dialysis|elder|baby|குழந்தை/i.test(t),life:/தண்ணீர் வருகிறது|water in|உடனே|mulgudhu|urgent|ஆபத்து/i.test(t),hasLowBattery};
}

async function send(){
  const t=$('#mi').value.trim();
  if(!t) return toast('Please speak or type a message first');
  $('#chat').innerHTML+=`<div class="bub me ${/[\u0B80-\u0BFF]/.test(t)?'ta':''}">${t}</div>`;
  $('#mi').value='';
  
  // Real Backend API call to /api/extract
  let X = localX(t);
  let eng = 'Backend AI';
  try{
    const r = await fetch('/api/extract', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({text: t, district: S.district})
    });
    if(r.ok){
      const j = await r.json();
      if(j.extracted){ X = {...X, ...j.extracted}; eng = j.engine || 'Backend AI'; }
    }
  }catch(e){
    eng = 'Offline Edge Rules';
  }

  const {lang,loc,need,n,vul,life,hasLowBattery}=X;
  const reportDistrict=(S.district!=='ALL'?S.district:(X.district||'Chennai'));
  if(X.district) X.district=reportDistrict;
  const dup=loc==='Velachery'&&need==='rescue';
  const score=Math.min(99,40+(life?25:0)+(vul?20:0)+(hasLowBattery?15:0)+Math.min(n,10)+(dup?8:0));
  const tr=dup?88:62;
  const cf=Math.round(30+tr*.65);
  const nowTime = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});

  const ch=(k,v)=>`<span class="chipd">${k}: <b>${v}</b></span>`;
  const D=[
    `${nowTime} · Citizen Report Ingested`,
    lang,
    ch('location',loc)+ch('need',need)+ch('people',n)+ch('vulnerable',vul?'yes':'no')+ch('life threat',life?'yes':'no')+`<span class="tg Verify">${eng}</span>`,
    `${loc} · ${X.lat != null && X.lon != null ? `Gazetteer pin (${X.lat}°N, ${X.lon}°E)` : 'Location requires officer verification'}`, 
    dup?'⧉ Merged into RQ-2041 (4 independent corroborations)':'Unique incident registered',
    `Urgency Score ${score}/100 ${ul(score)}${hasLowBattery?' (⚡ Last-Gasp Signal Boost applied)':''} · AI confidence ${cf}%`,
    `Trust Rating ${tr}/100${tr<70?' · Flagged: Verify First':''}`
  ];

  for(let i=0;i<7;i++){ $('#p'+i).classList.remove('d'); $('#d'+i).innerHTML=''; }
  D.forEach((d,i)=>setTimeout(()=>{
    $('#p'+i).classList.add('d');
    $('#d'+i).innerHTML=d;
    if(i===6){
      const r=['உங்கள் அவசர கோரிக்கை பெறப்பட்டது. மீட்புக் குழு அனுப்பப்படுகிறது.','Your emergency request is received. Rescue unit dispatched.'];
      out.unshift(r);
      aud('AI processed report',loc+' · '+need+' · score '+score,'ResQLink AI');
      $('#chat').innerHTML+=`<div class="bub ta">${r[0]}</div>`;
      $('#chat').scrollTop = $('#chat').scrollHeight;
      if(dup) S.merged++; else {S.open++;const newId='RQ-'+(synthNo++);const newCase={id:newId,district:reportDistrict,s:score,t:need,sum:t.slice(0,110),loc,lat:X.lat||DISTRICT_GEO[reportDistrict]?.[0]||13.0827,lon:X.lon||DISTRICT_GEO[reportDistrict]?.[1]||80.2707,n,tr, tags:['SYNTHETIC DEMO','New report'],st:'New',w:0,stage:3,resp:'Unassigned demo response team',km:'1.5',why:[['Urgency score',score],...(vul?[['Vulnerable person',20]]:[]),['People affected',n]],pos:['Submitted in local prototype simulator'],neg:['Awaiting human verification'],demoSource:'User-entered demo simulation',cf};C.push(newCase);}
      $('#ob').innerHTML=obHTML();
      toast('Pipeline complete · instant acknowledgment sent');
    }
  }, 400*(i+1)));
}
